[project]
name = "aesthetic-api"
version = "0.1.0"
description = "Aesthetic HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "aesthetic",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aesthetic_api"]

[tool.uv.sources]
aesthetic = { workspace = true }
