[project]
name = "aesthetic"
version = "0.1.0"
description = "Aesthetic: conversational, multimodal shopping assistant (engine, catalog pipeline, evaluation)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.1.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai", "catalog", "evaluation"]

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "catalog", "evaluation", "aesthetic_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "apps/api"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: needs running services such as Postgres",
    "slow: loads ML models or large data; skipped in CI",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-tqdm>=4.70.0.20260906",
]
