[project]
name = "aesthetic"
version = "0.1.0"
description = "Aesthetic: conversational, multimodal shopping assistant (engine, catalog pipeline, evaluation)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.5",
    "numpy>=2.5.3",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai", "catalog", "evaluation"]

[tool.uv.workspace]
members = ["apps/api"]

# PyTorch: on Linux (CI) use the small CPU-only build; on macOS use PyPI's build (includes Apple GPU support).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ai", "catalog", "evaluation", "aesthetic_api"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "apps/api"
[[tool.mypy.overrides]]
module = ["open_clip", "open_clip.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "--import-mode=importlib -m 'not slow'"
markers = [
    "integration: needs running services such as Postgres",
    "slow: loads ML models or large data; skipped in CI",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-tqdm>=4.70.0.20260906",
]
